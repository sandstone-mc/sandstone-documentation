name: Showcase Submission
description: Submit your Sandstone-powered project to be featured in the Community Showcase
title: "[Showcase] "
labels: ["showcase-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for wanting to share what you built! Fill out as much as you can below and a maintainer will review it and add it to the [Showcase](https://sandstone.dev/showcase).

  - type: input
    id: title
    attributes:
      label: Project Title
      placeholder: "My Awesome Datapack"
    validations:
      required: true

  - type: input
    id: tagline
    attributes:
      label: Tagline
      description: One sentence describing the project.
      placeholder: "A rhythm minigame built entirely in TypeScript."
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Markdown is supported (bold, italic, links, headings).
      placeholder: "Tell us what it does, how it works, and what makes it interesting..."
    validations:
      required: true

  - type: textarea
    id: images
    attributes:
      label: Screenshots
      description: Drag and drop at least one image here — GitHub will host it and generate the link automatically.
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Source Code Link
      placeholder: "https://github.com/you/your-project"

  - type: input
    id: modrinth
    attributes:
      label: Modrinth Link (optional)

  - type: input
    id: smithed
    attributes:
      label: Smithed Link (optional)

  - type: input
    id: planetminecraft
    attributes:
      label: Planet Minecraft Link (optional)

  - type: input
    id: tags
    attributes:
      label: Tags
      description: Comma-separated (e.g. "minigame, event, gameplay")

  - type: textarea
    id: credits
    attributes:
      label: Credits
      description: "Who worked on this, and what did they do? One per line, e.g. \"YourName - Programming, Design\", you may also include social links for each credit and an optional minecraft username/uuid to have their player head displayed"
    validations:
      required: true

  - type: input
    id: contact
    attributes:
      label: Discord username or other contact (optional)
